<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Eden</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#screen{width:100%;height:100%}
</style>
</head>
<body>
<div id="screen"></div>
<script type="module">
import RFB from "./core/rfb.js";

const screen = document.getElementById("screen");
const viewOnly = new URLSearchParams(location.search).has("view_only");

function connect() {
  screen.replaceChildren();
  const rfb = new RFB(screen, `ws://${location.host}/websockify`);
  rfb.viewOnly = viewOnly;
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.showDotCursor = false;
  rfb.background = "#000";
  rfb.addEventListener("disconnect", () => setTimeout(connect, 1000));
}

for (const type of ["keydown", "keyup"]) {
  window.addEventListener(type, (event) => {
    parent.postMessage({ carafeKey: type, key: event.key }, "*");
  }, true);
}

connect();
</script>
</body>
</html>
