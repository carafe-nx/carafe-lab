[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
lab-core = { path = "crates/lab-core" }
lab-run = { path = "crates/lab-run" }
lab-eden = { path = "crates/lab-eden" }
carafe-core = { path = "../external/carafe/app/crates/carafe-core" }
carafe-folder = { path = "../external/carafe/app/crates/carafe-folder" }
carafe-pack = { path = "../external/carafe/app/crates/carafe-pack" }
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.sha2]
opt-level = 3
